<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070d"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="white" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Sun icon -->
  <g transform="translate(960, 130)">
    <circle r="42" fill="url(#accent)"/>
    <g stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-65" x2="0" y2="-80"/>
      <line x1="0" y1="65" x2="0" y2="80"/>
      <line x1="-65" y1="0" x2="-80" y2="0"/>
      <line x1="65" y1="0" x2="80" y2="0"/>
      <line x1="-46" y1="-46" x2="-57" y2="-57"/>
      <line x1="46" y1="46" x2="57" y2="57"/>
      <line x1="46" y1="-46" x2="57" y2="-57"/>
      <line x1="-46" y1="46" x2="-57" y2="57"/>
    </g>
  </g>

  <!-- Title block -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="600" fill="#9b9bb3" letter-spacing="3">
    IBERIA TRIP
  </text>
  <text x="80" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="96" font-weight="800" fill="white" letter-spacing="-2">
    Algarve · Lisbona
  </text>
  <text x="80" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="96" font-weight="800" fill="url(#accent)" letter-spacing="-2">
    Siviglia
  </text>

  <!-- Dates pill -->
  <g transform="translate(80, 480)">
    <rect width="240" height="50" rx="25" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="120" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">
      8 – 15 Agosto 2026
    </text>
  </g>

  <!-- Feature chips -->
  <g transform="translate(360, 480)">
    <rect width="130" height="50" rx="25" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)"/>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#c4b5fd" text-anchor="middle">🌤️ Meteo</text>
  </g>
  <g transform="translate(510, 480)">
    <rect width="130" height="50" rx="25" fill="rgba(6,182,212,0.2)" stroke="rgba(6,182,212,0.4)"/>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#67e8f9" text-anchor="middle">🏄 Surf</text>
  </g>
  <g transform="translate(660, 480)">
    <rect width="130" height="50" rx="25" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)"/>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#86efac" text-anchor="middle">🗺️ Offline</text>
  </g>
</svg>
